# ─────────────────────────────────────────────────────────────────────────────
# EXAMPLE ONLY. Nothing reads this file.
#
# Copy it to `crust.lifecycles.local.yaml` — same directory, drop the
# `.example` — and it is picked up automatically on the next run. That name is
# gitignored, so what you put in it stays on your machine.
#
#     cp .pi-crust/config/crust.lifecycles.local.example.yaml \
#        .pi-crust/config/crust.lifecycles.local.yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── How this merges with the team's file ─────────────────────────────────────
#
# A Lifecycle REPLACES the team's outright, unlike an Activity, which merges
# key by key. An Activity is a bag of settings; a Lifecycle is a graph, and
# splicing one of your Stages into somebody else's graph by name produces an
# arrangement neither of you wrote.
#
# So naming `sdlc` here means "my sdlc, entirely" — copy the team's and edit
# it, rather than writing only the part you wanted to change.
#
# A name the team file does not have is simply a new Lifecycle.
#
# Both files are validated together at load. Two Stages with one name, or a
# Stage naming the same Activity twice, is refused before the run starts
# rather than three Activities in.
# ─────────────────────────────────────────────────────────────────────────────

lifecycles:
  # Your own short chain. A serial Stage is a sequence, so three dependent
  # Activities are one Stage — splitting them would say nothing extra and
  # would read as three progression steps that are really one.
  - name: quick
    description: Plan it, build it, and check it still compiles.
    stages:
      - name: deliver
        strategy: serial
        activities: [plan, build, verify]

  # Independence, said out loud. Both researchers only read the repository and
  # write their own findings file, so neither can see the other's work in
  # progress — which is what `concurrent` claims, and what the disjoint
  # `writes` check verifies before the run starts.
  - name: survey
    description: Look at it from two directions before deciding anything.
    stages:
      - name: research
        strategy: concurrent
        activities: [technical-research, domain-research]
      - name: decide
        activities: [conceptualize]
