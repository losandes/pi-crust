# This workflow installs dependencies, lints, type-checks, builds, and tests
# the package on every push and pull request against latest.
# For more information see: https://github.com/jdx/mise-action

name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Installs the tools mise.toml names, the same way a developer's
      # machine does: node and just from [tools], and bun from package.json's
      # `packageManager`, not `latest`. The two disagreed once: bun 1.3
      # deletes an env var assigned `undefined` and bun 1.4 stores the string
      # "undefined", so a suite that passed on a developer's machine failed
      # eleven tests on the runner. One version, named in one place.
      #
      # The action passes --monorepo to `mise install` itself when mise.toml
      # declares `[monorepo].config_roots`.
      - uses: jdx/mise-action@v5

      - run: bun --version

      # --monorepo runs the [deps.bun] provider in every config root, not
      # only the repository root. Without it apps/visualizer has no
      # node_modules, and the visualizer typecheck fails on `vite/client`.
      - name: Install dependencies
        run: mise deps install --monorepo

      # Without it the browser-driven visualizer tests skip, and a suite that
      # did not run them is green for the wrong reason.
      #
      # Run from apps/visualizer, where playwright is a pinned dependency. At
      # the root `bunx playwright` resolves to whatever version is latest,
      # which downloads a Chromium revision the pinned playwright never looks
      # for, so every browser test skipped while this step reported success.
      - name: Install Chromium for the browser-driven tests
        working-directory: apps/visualizer
        run: bunx playwright install --with-deps chromium

      # crust-home-resolution.test.ts evaluates the real crust.just through
      # the real just, and skips itself when the binary is absent. mise
      # installs it from mise.toml's [tools], which is how those six tests
      # run here rather than report as skipped.
      - run: just --version

      # No CRUST_STRICT here, deliberately: no pi is installed on the runner,
      # so typecheck:harness reports that it did not check
      # harness-engineering/ and the build carries that gap knowingly.
      - name: Check the code
        run: bun run check
