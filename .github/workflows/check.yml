# This workflow installs dependencies, lints, type-checks, builds, and tests
# the package on every push and pull request against latest.
# For more information see: https://github.com/oven-sh/setup-bun

name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the code
        env:
          CI: true
        run: bun run check
