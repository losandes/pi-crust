# Every Activity this repository offers.
#
# An Activity is a discrete unit of work. A Lifecycle in crust.lifecycles.yaml
# names Activities; this file defines them, so the same Activity takes part in
# as many Lifecycles as you like without being duplicated.
#
# This lists everything pi-crust offers rather than only your additions, which
# is what lets you remove one: delete the entry and the capability is gone.
#
# The order here is the order interactive lists display. Reorder the file to
# reorder the menu — nothing else records a sequence, so nothing else can
# drift out of step with the Activities that exist.
#
# Prompt references resolve against this repository first and the pi-crust
# package second: write .pi-crust/prompt-engineering/planner/system.md and it
# wins, with no other change.
#
# Personal deviations go in crust.activities.local.yaml, which is gitignored.
# A local layer may set any key and may add an Activity this file lacks.

activities:
  # 1.2 Identify. Outcome and success criteria, never implementation — the
  # criteria it writes are what `review` rules against and what a human checks
  # at launch, so a vague one here is a vague verdict three stages later.
  - name: analyst
    color: blue
    purpose: Turn a problem into an outcome with criteria anyone could check.
    prompt_engineering:
      system: prompt-engineering/analyst/system.md
      user: prompt-engineering/analyst/user.md
    writes: ['{handoff}/identify.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/

  # 1.2b Diagnose. For work that starts from a symptom rather than from a
  # wish — a bug report, usually written by someone who cannot see the code.
  # It may write a failing test and nothing else: the moment a cause becomes
  # obvious, fixing it is tempting, and a fix applied here is one nobody
  # planned or reviewed, with the reproduction that would have proved it gone.
  - name: diagnostician
    color: purple
    purpose: Reproduce the reported behaviour and name its cause, with evidence.
    prompt_engineering:
      system: prompt-engineering/diagnostician/system.md
      user: prompt-engineering/diagnostician/user.md
    # Tests only. A diagnosis is worth far more when it leaves behind a test
    # that fails for the bug, and worth nothing if the diagnostician "helpfully"
    # fixes what it found — a fix nobody planned, tested or reviewed, with the
    # reproduction destroyed. Narrow these globs to your own test layout.
    writes:
      - "{handoff}/diagnosis.md"
      - "**/*.test.*"
      - "**/*_test.*"
      - "**/test/**"
      - "**/tests/**"
      - "**/spec/**"

  # 1.3 Conceptualize and 2.2 Design are two agents, not one, because each
  # needs a prohibition the other must not carry: the solutions architect may
  # not choose technology, and the technical architect may not reopen the
  # logical model. One prompt holding both contradicts itself, and the agent
  # resolves the contradiction by settling the schema while still deciding
  # what the domain means.
  - name: solutions-architect
    color: cyan
    purpose: Decide what the solution must mean and do; choose no technology.
    prompt_engineering:
      system: prompt-engineering/solutions-architect/system.md
      user: prompt-engineering/solutions-architect/user.md
    writes: ['{handoff}/conceptualize.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/

  - name: technical-architect
    color: pink
    purpose: Give the logical architecture a physical shape here, observability included.
    prompt_engineering:
      system: prompt-engineering/technical-architect/system.md
      user: prompt-engineering/technical-architect/user.md
    writes: ['{handoff}/design.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/

  - name: planner
    model: fireworks/accounts/fireworks/models/kimi-k3
    thinking: high
    color: violet
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: prompt-engineering/planner/system.md
      user: prompt-engineering/planner/user.md
    harness_engineering:
      - harness-engineering/subagents.ts      # registers the four subagent_* tools below
    writes:                        # the plan is the only thing it may leave in the repo
      - "{handoff}/plan.md"
      - specs/
    tools:                         # full recon + write for plan.md; no edit — the planner never touches repo files
      - bash
      - edit
      - read
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  - name: builder
    color: green
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: prompt-engineering/builder/system.md
      user: prompt-engineering/builder/user.md
    writes: ['*']                  # unrestricted, and the only agent that is. It
    # still cannot touch defaults.protected_files — the builder does not get to
    # edit its own grader. Said out loud because silence no longer grants it.

  - name: scout
    color: orange
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: prompt-engineering/scout/system.md
      user: prompt-engineering/scout/user.md
    harness_engineering:
      - harness-engineering/subagents.ts      # registers the four subagent_* tools below
    writes: ['{handoff}/scout_findings.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/
    tools:
      - bash
      - edit
      - read
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  # Writing a test and running one are different jobs, so they are different
  # steps. `test` is an AGENT because deciding what would prove a change
  # correct is judgement. `verify` is a kind="code" phase because running the
  # suite is a known command, and an agent rediscovering it pays a context
  # window to learn what a subprocess already knows. See SKILL.md hard rule 8.
  - name: tester
    color: teal
    purpose: Write the tests that would prove the request was implemented; implement nothing else.
    prompt_engineering:
      system: prompt-engineering/tester/system.md
      user: prompt-engineering/tester/user.md
    writes:                        # "the tester only writes tests" is enforced here,
      - "**/*.test.ts"             # not asserted in a prompt the model may drift from
      - "**/*.test.tsx"
      - "**/*.spec.ts"
      - "**/__tests__/"
      - "**/tests/"

  - name: code-reviewer
    model: openai/gpt-5.6-terra
    thinking: high
    color: indigo
    purpose: Judge the change against this repository's ratified conventions, through its own review skill.
    prompt_engineering:
      system: prompt-engineering/code-reviewer/system.md
      user: prompt-engineering/code-reviewer/user.md
    writes: ['{handoff}/code_review.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/

  - name: reviewer
    model: openai/gpt-5.6-terra
    thinking: high
    color: lime
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: prompt-engineering/reviewer/system.md
      user: prompt-engineering/reviewer/user.md
    writes: ['{handoff}/review.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/

  - name: documenter
    model: openai/gpt-5.6-luna
    color: blue
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: prompt-engineering/documenter/system.md
      user: prompt-engineering/documenter/user.md
    writes:                        # documentation only
      - "{handoff}/document.md"
      - "**/adr/"
      - "**/docs/"                 # Markdown anywhere, because docs live next to the
      - "**/*.md"                  # code they describe as often as in a docs folder.
      - "*.md"

  # ── Research ────────────────────────────────────────────────────────────────
  # Five disciplines, one contract: establish what is TRUE in your subject and
  # decide nothing. They are separate agents rather than one researcher with a
  # topic because the sources, the failure modes and the standards of evidence
  # differ — a security reviewer reads adversarially, a data analyst reads for
  # bias, and one prompt asked to do both does neither well.

  # The repository is its primary source; documentation and specs corroborate it.
  - name: technical-researcher
    color: purple
    purpose: Establish what is technically true, feasible, and evidenced.
    prompt_engineering:
      system: prompt-engineering/technical-researcher/system.md
      user: prompt-engineering/technical-researcher/user.md
    writes: ['{handoff}/technical-research.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/
    tools:
      - bash
      - edit
      - read
      - write
      - web_search
      - web_fetch

  # Reads support requests, feedback and interfaces — never treats a proposed feature as a need.
  - name: ux-researcher
    color: cyan
    purpose: Establish what users need, experience, and struggle with.
    prompt_engineering:
      system: prompt-engineering/ux-researcher/system.md
      user: prompt-engineering/ux-researcher/user.md
    writes: ['{handoff}/ux-research.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/
    tools:
      - bash
      - edit
      - read
      - write
      - web_search
      - web_fetch

  # Industry convention against house interpretation; never invents a rule to close a gap.
  - name: domain-researcher
    color: pink
    purpose: Model the domain and the rules that actually govern it.
    prompt_engineering:
      system: prompt-engineering/domain-researcher/system.md
      user: prompt-engineering/domain-researcher/user.md
    writes: ['{handoff}/domain-research.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/
    tools:
      - bash
      - edit
      - read
      - write
      - web_search
      - web_fetch

  # Reads adversarially. Demonstrated, plausible and speculative are three different claims.
  - name: security-researcher
    color: rose
    purpose: Establish how this could fail, be misused, or be attacked.
    prompt_engineering:
      system: prompt-engineering/security-researcher/system.md
      user: prompt-engineering/security-researcher/user.md
    writes: ['{handoff}/security-research.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/
    tools:
      - bash
      - edit
      - read
      - write
      - web_search
      - web_fetch

  # Deliberately has NO database access. It writes the query for a person to run:
  # an agent deciding on its own to query a live store cannot see the load it
  # would add, the replica it is really pointed at, or what the query will do.
  - name: data-researcher
    color: violet
    purpose: Establish what the data can show, and what it cannot.
    prompt_engineering:
      system: prompt-engineering/data-researcher/system.md
      user: prompt-engineering/data-researcher/user.md
    writes: ['{handoff}/data-research.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/
    tools:
      - bash
      - edit
      - read
      - write
      - web_search
      - web_fetch

  # ── Design ──────────────────────────────────────────────────────────────────
  - name: ux-designer
    color: orange
    purpose: Specify an interface precisely enough to implement without inventing UX.
    prompt_engineering:
      system: prompt-engineering/ux-designer/system.md
      user: prompt-engineering/ux-designer/user.md
    writes: ['{handoff}/ux-design.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/
    tools:
      - bash
      - edit
      - read
      - write
      - web_search
      - web_fetch

  # ── Operation ───────────────────────────────────────────────────────────────
  # Chooses the chain and performs none of it. Its envelope is the only one the
  # runner EXECUTES, which is why `steps_valid` gates it: an invented step name
  # is not a weak suggestion, it is a run that cannot start.
  - name: triage
    color: amber
    purpose: Choose the smallest chain that can produce the outcome, and hand it back.
    prompt_engineering:
      system: prompt-engineering/triage/system.md
      user: prompt-engineering/triage/user.md
    writes: ['{handoff}/plan.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/
    tools:      # enough to size the work, not to do it
      - read
      - write

  - name: operator
    color: amber
    purpose: Choose the smallest chain of steps that can produce the outcome.
    prompt_engineering:
      system: prompt-engineering/operator/system.md
      user: prompt-engineering/operator/user.md
    writes: ['{handoff}/plan.md']  # its findings, and nothing else in the repo
                # its deliverable goes to context_handoff/
    tools:      # enough to size the work, not to do it
      - read
      - write
