# crust.config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
# v1 runs the Pi coding agent only; coding_agent: claude_code arrives in v2.
defaults:
  coding_agent: pi
  # The model every agent gets unless its own entry overrides it. Replace it
  # with one your credentials actually reach: `pi --list-models` is the
  # authority, and config validation refuses a model that is not there rather
  # than failing later inside an agent.
  model: anthropic/claude-sonnet-5   # provider/id — a bare pattern is ambiguous across providers
  thinking: medium                 # off | minimal | low | medium | high | xhigh | max
  harness_engineering: []          # pi extensions loaded into the harness (-e)
  # Roster-wide allowlist; any agent may override with its own list.
  # NOTE: --tools filters extension and custom tools too, not just builtins. An agent
  # whose harness_engineering extension registers a tool MUST name that tool in its own
  # tools list — otherwise the extension loads and its tool is silently filtered out.
  tools:
    - read                         # read file contents
    - bash                         # execute bash commands
    - edit                         # find/replace edits
    - write                        # create/overwrite files
    - grep                         # search file contents  (pi default: OFF)
    - find                         # find files by glob     (pi default: OFF)
    - ls                           # list directories       (pi default: OFF)
  # Off-limits to every agent that does not name them in its own `writes`.
  # `tools` alone cannot protect these: bash runs `git checkout`, and write
  # reaches any path. An agent must not be able to edit the machinery that
  # decides whether its own work passed. Enforced in
  # .pi-crust/modules/use-cases/enforce-permissions.ts.
  #
  # `writes:` per agent says what it may change IN THE REPO. It never restricts
  # the session runtime under data_dir — context_handoff/, envelopes, prompts,
  # raw output. Every agent can always write its own report; `writes: []` means
  # read-only with respect to the repo, not mute.
  protected_files:
    - .pi-crust/modules/
    - .pi-crust/config/
    - .pi-crust/stages/
    - .pi-crust/lifecycles/
    - .pi-crust/package.json
  data_dir: .pi-crust/data             # runtime home: {data_dir}/sessions/{run_id}/{agent_name}/

# ── steps: what `just crust please` offers, and in what order ───────────────
# Neither key changes what CAN run. A lifecycle, an operator, or an explicit
# --steps still runs any step; these two shape the menu and the default
# sequence of a hand-picked chain. Both are overridable per developer in
# crust.config.local.yaml.
steps:
  # The order a hand-picked chain runs in. PARTIAL IS FINE and is the point:
  # the steps named here take the slots that named steps occupy in the
  # built-in order, and everything unnamed stays exactly where it was. So
  # listing two steps swaps those two and moves nothing else.
  order:
    - identify
    - diagnose
    - conceptualize
    - design
    - plan
    - test
    - build
    - verify
    - review
    - code-review
    - document

  # Kept out of the menu — for people who drive this with lifecycles or an
  # operator and do not want to scroll past steps they never pick by hand.
  # Still runnable by name: hiding is a preference, not a permission.
  hidden: []

observability:
  db: .pi-crust/data/crust.db           # tracer writes here directly; the UI polls it
  poll_ms: 500                     # visualizer live-poll cadence

# What agents LOAD and what `verify` RUNS, both selected by the paths a change
# actually touched. This section is the ONLY place a skill path or a checker
# command may appear: crust is stamped into other repositories, so a prompt or a
# module that named one would be naming something that does not exist there.
#
# Glob semantics are the ones `writes:` uses: `*` does not cross `/`, `**` does.
# A rule written `when: ["*.ts"]` therefore matches only the repository root and
# silently covers nothing nested — which reads as a pass. An empty `when`
# always matches.
routing:
  # Declare yours here. Empty is honest, not safe: `verify` FAILS when paths
  # changed and no check matched them, because a check nobody declared cannot
  # have passed.
  skills: []
  checks: []

  # EXAMPLE — the shape, with paths and commands from the repository crust was
  # built in. None of them exist here until you say they do.
  #
  # skills:
  #   - name: code-review
  #     agents: [code-reviewer]          # omit to give it to every agent
  #     when: ["**/*.ts", "**/*.tsx"]
  #     path: .claude/skills/code-review
  #
  #   - name: respond-to-pr-comments    # how to ANSWER a review, not what to
  #     agents: [builder]               # change — so no `when:` at all
  #     phases: [revise]                # omit to give it to every phase;
  #     path: .claude/skills/respond-to-pr-comments   # `revise_2` matches too
  #
  # checks:
  #   - name: test
  #     when: ["**/*.ts"]
  #     operation: test                  # lint | typecheck | build | test
  #     argv: [bun, test]                # argv LIST, binaries by BARE NAME
  #     timeout_seconds: 600
  #
  #   - name: lint
  #     when: ["**/*.ts", "**/*.tsx"]
  #     operation: lint
  #     argv: [node_modules/.bin/biome, lint]
  #     with_changed_paths: true         # append the matched paths to argv
  #     timeout_seconds: 300
  #
  # `when:` globs are spelled from the GIT ROOT, because that is where changed
  # paths are collected. Add `cwd:` when a command belongs to a subdirectory —
  # a nested workspace, a package with its own config — and the paths handed to
  # it are rebased onto that cwd so they still resolve:
  #
  #   - name: typecheck
  #     when: ["packages/api/**/*.ts"]
  #     operation: typecheck
  #     cwd: packages/api
  #     argv: [bun, x, tsc, --noEmit]

agents:
  # 1.2 Identify. Outcome and success criteria, never implementation — the
  # criteria it writes are what `review` rules against and what a human checks
  # at launch, so a vague one here is a vague verdict three stages later.
  - name: analyst
    color: blue
    purpose: Turn a problem into an outcome with criteria anyone could check.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/analyst/system.md
      user: .pi-crust/prompt-engineering/analyst/user.md
    writes: []                     # its deliverable goes to context_handoff/
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write

  # 1.2b Diagnose. For work that starts from a symptom rather than from a
  # wish — a bug report, usually written by someone who cannot see the code.
  # It may write a failing test and nothing else: the moment a cause becomes
  # obvious, fixing it is tempting, and a fix applied here is one nobody
  # planned or reviewed, with the reproduction that would have proved it gone.
  - name: diagnostician
    color: purple
    purpose: Reproduce the reported behaviour and name its cause, with evidence.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/diagnostician/system.md
      user: .pi-crust/prompt-engineering/diagnostician/user.md
    # Tests only. A diagnosis is worth far more when it leaves behind a test
    # that fails for the bug, and worth nothing if the diagnostician "helpfully"
    # fixes what it found — a fix nobody planned, tested or reviewed, with the
    # reproduction destroyed. Narrow these globs to your own test layout.
    writes:
      - "**/*.test.*"
      - "**/*_test.*"
      - "**/test/**"
      - "**/tests/**"
      - "**/spec/**"
    tools:
      - read
      - grep
      - find
      - ls
      - bash                       # reproducing means RUNNING things
      - write

  # 1.3 Conceptualize and 2.2 Design are two agents, not one, because each
  # needs a prohibition the other must not carry: the solutions architect may
  # not choose technology, and the technical architect may not reopen the
  # logical model. One prompt holding both contradicts itself, and the agent
  # resolves the contradiction by settling the schema while still deciding
  # what the domain means.
  - name: solutions-architect
    color: cyan
    purpose: Decide what the solution must mean and do; choose no technology.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/solutions-architect/system.md
      user: .pi-crust/prompt-engineering/solutions-architect/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: technical-architect
    color: pink
    purpose: Give the logical architecture a physical shape here, observability included.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/technical-architect/system.md
      user: .pi-crust/prompt-engineering/technical-architect/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: planner
    model: fireworks/accounts/fireworks/models/kimi-k3
    thinking: high
    color: violet
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/planner/system.md
      user: .pi-crust/prompt-engineering/planner/user.md
    harness_engineering:
      - .pi-crust/harness-engineering/subagents.ts      # registers the four subagent_* tools below
    writes:                        # the plan is the only thing it may leave in the repo
      - specs/
    tools:                         # full recon + write for plan.md; no edit — the planner never touches repo files
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  - name: builder
    color: green
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/builder/system.md
      user: .pi-crust/prompt-engineering/builder/user.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.
    tools:                         # the only agent that mutates the repo — everything on
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: scout
    color: orange
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/scout/system.md
      user: .pi-crust/prompt-engineering/scout/user.md
    harness_engineering:
      - .pi-crust/harness-engineering/subagents.ts      # registers the four subagent_* tools below
    writes: []                     # read-only, and now actually read-only: its findings
                                   # go to context_handoff/, which is runtime, not the repo
    tools:                         # search-heavy recon; write only so scout_findings.md lands without a bash heredoc
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  # Writing a test and running one are different jobs, so they are different
  # steps. `test` is an AGENT because deciding what would prove a change
  # correct is judgement. `verify` is a kind="code" phase because running the
  # suite is a known command, and an agent rediscovering it pays a context
  # window to learn what a subprocess already knows. See SKILL.md hard rule 8.
  - name: tester
    color: teal
    purpose: Write the tests that would prove the request was implemented; implement nothing else.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/tester/system.md
      user: .pi-crust/prompt-engineering/tester/user.md
    writes:                        # "the tester only writes tests" is enforced here,
      - "**/*.test.ts"             # not asserted in a prompt the model may drift from
      - "**/*.test.tsx"
      - "**/*.spec.ts"
      - "**/__tests__/"
      - "**/tests/"
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: code-reviewer
    model: openai/gpt-5.6-terra
    thinking: high
    color: indigo
    purpose: Judge the change against this repository's ratified conventions, through its own review skill.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/code-reviewer/system.md
      user: .pi-crust/prompt-engineering/code-reviewer/user.md
    writes: []                     # read-only: a reviewer that cannot fix cannot
                                   # quietly fix. Its review goes to context_handoff/.
    tools:                         # full read surface; write only for code_review.md
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: reviewer
    model: openai/gpt-5.6-terra
    thinking: high
    color: lime
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/reviewer/system.md
      user: .pi-crust/prompt-engineering/reviewer/user.md
    writes: []                     # a reviewer that cannot fix cannot quietly fix — the
                                   # claim the tool list only implied, now enforced
    tools:                         # full read surface; write only for review.md, no edit
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: documenter
    model: openai/gpt-5.6-luna
    color: blue
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/documenter/system.md
      user: .pi-crust/prompt-engineering/documenter/user.md
    writes:                        # documentation only — "document only" is a rule now,
      - app_docs/                  # not a line in a prompt the model may drift from.
      - docs/                      # Markdown anywhere, because docs live next to the
      - "**/*.md"                  # code they describe as often as in a docs folder.
      - "*.md"
    tools:                         # reads the diff and the code; writes/edits documentation only
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - edit

  # ── Research ────────────────────────────────────────────────────────────────
  # Five disciplines, one contract: establish what is TRUE in your subject and
  # decide nothing. They are separate agents rather than one researcher with a
  # topic because the sources, the failure modes and the standards of evidence
  # differ — a security reviewer reads adversarially, a data analyst reads for
  # bias, and one prompt asked to do both does neither well.

  # The repository is its primary source; documentation and specs corroborate it.
  - name: technical-researcher
    color: purple
    purpose: Establish what is technically true, feasible, and evidenced.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/technical-researcher/system.md
      user: .pi-crust/prompt-engineering/technical-researcher/user.md
    writes: []                     # read-only: findings go to context_handoff/, never the repo
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write                      # the findings file only; `writes: []` keeps it out of the repo
      - web_search
      - web_fetch

  # Reads support requests, feedback and interfaces — never treats a proposed feature as a need.
  - name: ux-researcher
    color: cyan
    purpose: Establish what users need, experience, and struggle with.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/ux-researcher/system.md
      user: .pi-crust/prompt-engineering/ux-researcher/user.md
    writes: []                     # read-only: findings go to context_handoff/, never the repo
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write                      # the findings file only; `writes: []` keeps it out of the repo
      - web_search
      - web_fetch

  # Industry convention against house interpretation; never invents a rule to close a gap.
  - name: domain-researcher
    color: pink
    purpose: Model the domain and the rules that actually govern it.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/domain-researcher/system.md
      user: .pi-crust/prompt-engineering/domain-researcher/user.md
    writes: []                     # read-only: findings go to context_handoff/, never the repo
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write                      # the findings file only; `writes: []` keeps it out of the repo
      - web_search
      - web_fetch

  # Reads adversarially. Demonstrated, plausible and speculative are three different claims.
  - name: security-researcher
    color: rose
    purpose: Establish how this could fail, be misused, or be attacked.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/security-researcher/system.md
      user: .pi-crust/prompt-engineering/security-researcher/user.md
    writes: []                     # read-only: findings go to context_handoff/, never the repo
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write                      # the findings file only; `writes: []` keeps it out of the repo
      - web_search
      - web_fetch

  # Deliberately has NO database access. It writes the query for a person to run:
  # an agent deciding on its own to query a live store cannot see the load it
  # would add, the replica it is really pointed at, or what the query will do.
  - name: data-researcher
    color: violet
    purpose: Establish what the data can show, and what it cannot.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/data-researcher/system.md
      user: .pi-crust/prompt-engineering/data-researcher/user.md
    writes: []                     # read-only: findings go to context_handoff/, never the repo
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write                      # the findings file only; `writes: []` keeps it out of the repo
      - web_search
      - web_fetch

  # ── Design ──────────────────────────────────────────────────────────────────
  - name: ux-designer
    color: orange
    purpose: Specify an interface precisely enough to implement without inventing UX.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/ux-designer/system.md
      user: .pi-crust/prompt-engineering/ux-designer/user.md
    writes: []                     # a specification, not an implementation
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - web_search
      - web_fetch

  # ── Operation ───────────────────────────────────────────────────────────────
  # Chooses the chain and performs none of it. Its envelope is the only one the
  # runner EXECUTES, which is why `steps_valid` gates it: an invented step name
  # is not a weak suggestion, it is a run that cannot start.
  - name: triage
    color: amber
    purpose: Choose the smallest chain that can produce the outcome, and hand it back.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/triage/system.md
      user: .pi-crust/prompt-engineering/triage/user.md
    writes: []                     # it recommends; the developer runs it
    tools:                         # enough to size the work, not to do it
      - read
      - grep
      - find
      - ls
      - write

  - name: operator
    color: amber
    purpose: Choose the smallest chain of steps that can produce the outcome.
    prompt_engineering:
      system: .pi-crust/prompt-engineering/operator/system.md
      user: .pi-crust/prompt-engineering/operator/user.md
    writes: []                     # it plans; every step it names does the work
    tools:                         # enough to size the work, not to do it
      - read
      - grep
      - find
      - ls
      - write
