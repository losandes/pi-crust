# Tool versions for this repository. `mise install` fetches them; shell
# activation, `mise exec --`, and the shims put them on PATH.
#
# A version is named in exactly one place.
# node is named here because nothing else in the repository pins it.
# bun is NOT named here —
# see [settings] below.

# ──────────────────────────────────────────────────────────────────────────────
# SETTINGS
# ──────────────────────────────────────────────────────────────────────────────

# mise.toml
monorepo_root = true

[monorepo]
config_roots = ["apps/*"]

[tools]
node = "26.13.0"

[settings]
# bun's version is declared once, in package.json's `packageManager`, which
# is also what CI reads (`oven-sh/setup-bun` with `bun-version-file:
# package.json`). This setting is what lets mise read that same field rather
# than carry a second pin that can drift from it. mise reads
# `devEngines.runtime`, then `devEngines.packageManager`, then the top-level
# `packageManager` field; it does not read `engines`.
idiomatic_version_file_enable_tools = ["bun"]
experimental = true

# ──────────────────────────────────────────────────────────────────────────────
# DEPENDENCIES
# ──────────────────────────────────────────────────────────────────────────────

[deps.bun]
auto = true
run = "bun install --frozen-lockfile"

[hooks]
enter = [
  "mise install --monorepo",
  "mise deps install --monorepo",
]

# ──────────────────────────────────────────────────────────────────────────────
# ENVVARS
# ──────────────────────────────────────────────────────────────────────────────

[env]
# --- Mode (both REQUIRED) -----------------------------------------------------
# 'cicd' | 'localhost' | 'development' | 'test' | 'staging' | 'production'
NODE_ENV = { default = "localhost" }
MODE = { default = "{{ env.NODE_ENV }}" }

# ──────────────────────────────────────────────────────────────────────────────
# TASKS
# ──────────────────────────────────────────────────────────────────────────────

# --- TESTS --------------------------------------------------------------------

# Runs backend tests
[tasks."test:be"]
env = { BUNTAP_REPORTER = "nyan" }
usage = 'flag "--coverage" help="collect coverage"'
run = 'bunx bunt lib runtime scripts {% if usage.coverage %}--coverage{% endif %} --parallel --timeout=15000 | bunx buntap'

# Runs frontend tests
[tasks."test:fe"]
env = { BUNTAP_REPORTER = "nyan" }
usage = 'flag "--coverage" help="collect coverage"'
run = 'bunx bunt apps/visualizer {% if usage.coverage %}--coverage{% endif %} --parallel --timeout=15000 | bunx buntap'

# Runs all the tests
[tasks.test]
env = { BUNTAP_REPORTER = "nyan" }
usage = 'flag "--coverage" help="collect coverage"'
run = 'bunx bunt apps/visualizer lib runtime scripts {% if usage.coverage %}--coverage{% endif %} --parallel --timeout=15000 | bunx buntap'

# Runs the tests with coverage for both backend and frontend
# Enahances the coverage output via buntap, so the agent receives what it needs
# to improve coverage without receiving all the noise from standard coverage reports
# Bound integration workers: browser/Vite and subprocess fixtures share host resources.
[tasks."test:agent"]
env = { RUN_INTEGRATION_TESTS = "true", CLAUDECODE = "1" }
run = "bunx bunt apps/visualizer lib runtime scripts --coverage --parallel=4 --timeout=15000 | bunx buntap --agent --no-color"

# CI tests use buntap instead of bunt/buntap
[tasks."test:raw"]
env = { RUN_INTEGRATION_TESTS = "true", CLAUDECODE = "1" }
run = "bun test apps/visualizer lib runtime scripts --coverage --parallel=4 --timeout=15000"

# --- BUILD --------------------------------------------------------------------

[tasks.build]
run = "bun run --cwd apps/visualizer build"

[tasks."build:package"]
run = "bun scripts/build-package.ts"

# --- LINTING ------------------------------------------------------------------

# Lints the project files
# Add `--fix` to automatically fix linting issues
[tasks.lint]
run = "bunx biome check apps lib runtime scripts templates"

[tasks.lintmd]
run = "bash .claude/skills/markdown-authoring/scripts/check-markdown.sh --all"

# --- TYPECHECK ----------------------------------------------------------------

[tasks."typecheck:runtime"]
run = "bun x tsc --noEmit -p runtime"

[tasks."typecheck:harness"]
run = "bun scripts/typecheck-harness.ts"

[tasks."typecheck:visualizer"]
run = "bun x tsc --noEmit -p apps/visualizer"

[tasks.typecheck]
run = [
  { task = "typecheck:runtime" },
  { task = "typecheck:harness" },
  { task = "typecheck:visualizer" }
]

# --- CHECK --------------------------------------------------------------------

[tasks."check:install"]
run = "bun scripts/check-install.ts"

[tasks.check]
run = [
  { task = "lint" },
  { task = "typecheck" },
  { task = "test:agent" },
  { task = "build" },
  { task = "check:install" }
]
