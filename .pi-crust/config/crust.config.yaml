
# Agent configuration. One agent, one prompt, one purpose.
# v1 supports Pi only; Claude Code support is planned for v2.
defaults:
  coding_agent: pi
  # Default model, written as provider/id and available in `pi --list-models`.
  # Every entry in crust.activities.yaml names its own model, so this is the
  # fallback for one added later without that decision being made. Haiku 5.5 at
  # max effort is the cheapest rung on the measured cost-per-task frontier --
  # 27.72 on FrontierCode 2.0 for $0.37 a task -- and it needs only an Anthropic
  # key, which is what a fallback has to be: the setting most likely to work
  # when nothing else has been thought about.
  #
  # Good alternative: openai/gpt-6.1-sol with thinking max. It scores 38.95 for
  # $1.03 a task, the best score per dollar of any model measured, so it buys
  # eleven points for sixty-six cents. It is not the default only because it
  # resolves through OpenRouter. Prefer it wherever OpenRouter is already a dependency.
  model: claude-code/claude-haiku-5-5
  thinking: max                    # off | minimal | low | medium | high | xhigh | max
  data_dir: "{primary_worktree}/.pi-crust/data"

  # Default tool allowlist. Agents may override it.
  # Extension tools must also be listed explicitly to be available.
  tools:
    - bash                         # execute commands
    - edit                         # find/replace
    - read                         # read files
    - write                        # create/overwrite files

  # Protected paths cannot be accessed without an agent-specific override.
  # Each agent must declare `writes` for repository changes.
  # `['*']` permits all paths; omission does not.
  # Session data under data_dir is exempt from write restrictions.
  # Globs: * matches within a directory; ** matches across directories.
  protected_files:
    - .pi-crust/config/
    - .env*
    - '**/.env*'

  # Access policies:
  # block = refuse before execution
  # stop  = execute, then terminate the Activity
  # warn  = execute and report
  # allow = execute without enforcement
  # No automatic revert: changes cannot reliably be attributed to agents.
  protected:
    read: block
    write: block

  # Gitignored paths, excluding session data under data_dir.
  # Reads are permitted with warnings; writes are blocked because
  # ignored changes are invisible to normal Git review.
  ignored:
    read: warn
    write: block


# Repository tasks run at `change`, after an Activity changes matching paths.
# `match` globs are Git-root-relative: * does not cross directories; ** does.
# An empty `match` selects every changed path that still exists.
# Use {{changed_paths}} and {{base_ref}} as unquoted shell arguments.
# `cwd` respells selected paths relative to the command's working directory.
#
task_config:
  timeout_seconds: 3000

tasks:
  lint:
    when:
      - { on: change }
    match: ["**/*.ts", "**/*.tsx"]
    run: "bunx biome check {{changed_paths}}"

  test:
    when:
      - { on: change, skip: [diagnose, test-tdd] }
    match: ["**/*.ts", "**/*.tsx"]
    run:
      - "CLAUDECODE=1 bunx bunt {{changed_paths}} --paired | bunx buntap --agent --no-color"

  verify-all:
    when:
      - { on: deliver, skip: [diagnose, test-tdd] }
    match: ["**/*.ts", "**/*.tsx"]
    run:
      - "mise run lint"
      - "mise run test:agent"
      - "mise run build"
    timeout_seconds: 10000
